# WAF (ModSecurity + OWASP CRS) — IV.5 Cybersecurity module.
#
# Kept in a separate compose file so the rest of the team's `make up` /
# `docker compose up` doesn't need to pull the ModSecurity image or care
# about this module at all. Bring it up alongside the base stack with:
#
#   docker compose -f docker-compose.yml -f docker-compose-security.yml up -d --build
#
# or `make security` (see Makefile). Requires backend/frontend to already
# be defined by docker-compose.yml — this file only adds to that stack, it
# doesn't stand alone.
#
# Two instances, one per upstream, since the browser calls the backend
# directly (NEXT_PUBLIC_API_URL) as well as loading the frontend — a WAF
# fronting only the frontend would inspect zero API traffic.
#
# In this stack the WAF is the *only* way in: backend's :4000 and frontend's
# :3000 are not published (see `ports: !reset []` below — a WAF with a bypass
# path isn't protecting anything). They still exist on the Docker network, which
# is how the WAFs reach them. The plain `make up` stack, which has no WAF, is
# unchanged and still publishes them. `!reset` needs Docker Compose >= 2.24.

services:
  waf-frontend:
    image: owasp/modsecurity-crs:nginx
    restart: unless-stopped
    environment:
      BACKEND: "https://frontend:3000"
      PROXY_SSL_VERIFY: "off" # frontend uses our own self-signed dev cert
      PORT: "8080"
      SSL_PORT: "8443"
      # OWASP CRS paranoia level 2 (stricter than the default 1). Rolled out
      # in two steps: 2026-10-05 detection only (logged, not blocked), then
      # 2026-10-06 blocking, after waf/pl2-report.sh showed only bots here.
      BLOCKING_PARANOIA: "2"
      DETECTION_PARANOIA: "2"
    ports:
      - "8443:8443"
    volumes:
      - ./certs/localhost.pem:/etc/nginx/conf/server.crt:ro
      - ./certs/localhost-key.pem:/etc/nginx/conf/server.key:ro
    depends_on:
      - frontend

  waf-backend:
    image: owasp/modsecurity-crs:nginx
    restart: unless-stopped
    environment:
      BACKEND: "https://backend:4000"
      PROXY_SSL_VERIFY: "off" # backend uses our own self-signed dev cert
      PORT: "8080"
      SSL_PORT: "8443"
      # CRS only allows GET HEAD POST OPTIONS by default (rule 911100); the
      # REST API also uses PUT/PATCH/DELETE. Not set on waf-frontend, which
      # only serves pages.
      ALLOWED_METHODS: "GET HEAD POST OPTIONS PUT PATCH DELETE"
      # Paranoia level 2, same two-step rollout as waf-frontend; the two real
      # false positives in free text (942440, 932236) are excluded narrowly in
      # waf/backend-exclusions.conf (rule 1000030).
      BLOCKING_PARANOIA: "2"
      DETECTION_PARANOIA: "2"
      # The API only ever receives JSON and has no file uploads, so anything
      # else is refused (CRS rule 920420), and bodies are capped at 1 MB
      # (default was 13 MB) / 128 KB without files; over the limit -> 413.
      ALLOWED_REQUEST_CONTENT_TYPE: "|application/json|"
      MODSEC_REQ_BODY_LIMIT: "1048576"
      MODSEC_REQ_BODY_NOFILES_LIMIT: "131072"
      MODSEC_REQ_BODY_LIMIT_ACTION: "Reject"
    ports:
      - "9443:8443"
    volumes:
      - ./certs/localhost.pem:/etc/nginx/conf/server.crt:ro
      - ./certs/localhost-key.pem:/etc/nginx/conf/server.key:ro
      - ./waf/backend-exclusions.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:ro
    depends_on:
      - backend

  # --- Secrets manager (HashiCorp Vault), IV.5 Cybersecurity module ---
  # DEV MODE — insecure by design, documented as such:
  #   - unsealed automatically, no storage backend (everything in-memory,
  #     wiped on every restart)
  #   - root token hardcoded below, not something to ever do outside dev
  # A real deployment needs: file/Raft storage backend, TLS, proper
  # unsealing (Shamir or auto-unseal), and the backend authenticating via
  # AppRole rather than the root token (see backend/src/vault/ once that's
  # wired up — root token is a bootstrapping stopgap, not the end state).
  vault:
    image: hashicorp/vault:latest
    restart: unless-stopped
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "dev-only-root-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"

  # Adds to (does not replace) backend's definition in docker-compose.yml —
  # compose merges `environment:` maps by key across -f files. Actually
  # runs with real values via scripts/vault-init.sh / `make security`,
  # which regenerates VAULT_ROLE_ID/VAULT_SECRET_ID every time since dev
  # Vault forgets them on restart. Without those set,
  # backend/src/vault/load-secrets.ts just no-ops and falls back to `.env`.
  backend:
    environment:
      VAULT_ADDR: ${VAULT_ADDR:-}
      VAULT_ROLE_ID: ${VAULT_ROLE_ID:-}
      VAULT_SECRET_ID: ${VAULT_SECRET_ID:-}
      # Secrets come ONLY from Vault in this stack (loaded in main.ts before
      # Nest starts). docker-compose.yml passes them from .env for the plain
      # `make up` stack; blanked here so they don't sit in clear text in the
      # container's environment (`docker inspect`). Same as SMTP_PASS, which
      # was never passed. Manual Prisma commands inside this container now
      # need the URL given explicitly, e.g.
      #   docker exec -e DIRECT_URL=... <backend> npx prisma db execute ...
      JWT_SECRET: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
      DATABASE_URL: ""
      DIRECT_URL: ""
      # The browser now loads the app from the WAF (:8443), so that's the
      # origin CORS has to allow. Overrides .env's :3000 for this stack only.
      CORS_ORIGIN: "https://localhost:8443"
    # Drops the :4000 mapping from docker-compose.yml for this stack only.
    ports: !reset []

  frontend:
    environment:
      # Browser-side API calls go through waf-backend (:9443) instead of
      # straight to :4000, otherwise the API traffic skips the WAF entirely.
      # Next runs in dev mode here, so this is read at container start — no
      # image rebuild needed.
      NEXT_PUBLIC_API_URL: "https://localhost:9443/api"
    # Drops the :3000 mapping from docker-compose.yml for this stack only.
    ports: !reset []
