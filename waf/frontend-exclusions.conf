# Loaded by waf-frontend as REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf (see
# docker-compose-security.yml), i.e. before the CRS rules it tunes.
#
# Next.js names the JS chunk of a dynamic route after its folder, e.g.
# /_next/static/chunks/app/canvas/[id]/page.js. At paranoia level 2, rule
# 932130 ("Unix Shell Expression") reads `/[id]` as a shell glob and blocks
# the chunk, so /canvas/<slug> renders but never runs its code and the tree
# never loads. Only this rule skips only the file path, only under
# /_next/static/ (build output served by Next, never user input); query
# strings there and every other path are still inspected.
SecRule REQUEST_FILENAME "@beginsWith /_next/static/" \
    "id:1000110,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveTargetById=932130;REQUEST_FILENAME"
