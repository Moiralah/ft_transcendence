# Loaded by waf-backend as REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf (see
# docker-compose.yml), i.e. before the CRS rules it tunes.
#
# Rule 930120 ("OS File Access Attempt") checks argument *names* against a list
# of OS files, which includes `.profile`. ModSecurity names JSON body fields
# `json.<key>`, so our own `profileId` field becomes `json.profileId`, which
# contains `.profile` and gets a request like PATCH /api/profile/:id blocked.
# Only this rule's inspection of the argument *name* `json.profileId` is
# skipped (ctl doesn't accept a regex target in this ModSecurity build, so any
# other JSON key containing `.profile` needs its own line). Values are still
# inspected by 930120, and every other rule still sees these fields.
SecRule REQUEST_URI "@beginsWith /api/" \
    "id:1000010,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveTargetById=930120;ARGS_NAMES:json.profileId"

# Password fields on the account-change routes. Passwords used to go straight
# from the browser to Supabase; since 2026-10-04 they reach these two routes
# through the WAF, and a strong password is exactly the kind of random string
# with quotes/dashes/brackets that SQLi/XSS rules flag. The values are only
# ever passed on to Supabase's own auth API, never into SQL or HTML, so CRS
# skips just these two JSON fields on just these two routes. newEmail and
# every other field are still inspected.
SecRule REQUEST_URI "@rx ^/api/auth/change-(email|password)$" \
    "id:1000020,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.currentPassword,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:json.newPassword"

# Paranoia level 2 false positives in normal free text (found with
# waf/pl2-report.sh on real traffic, 2026-10-06):
#   942440 "SQL Comment Sequence"       -- a plain "--" ("born 1950 -- died 2001")
#   932236 "Unix Command Injection"     -- a first name of "Local" (also a shell word)
#   942200 "MySQL comment-/space-obfuscated injections" -- a comma before a word,
#          e.g. feedback "it froze, ignore the first report" (found 2026-10-16)
# People's names, bios, tree names/descriptions, feedback and search terms are
# exactly where such text appears. Only these three rules skip only these fields;
# every other rule still inspects them, and these three still inspect everything
# else. The values reach the database through Prisma (parameterised queries)
# and are never run as shell commands.
SecRule REQUEST_URI "@beginsWith /api/" \
    "id:1000030,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveTargetById=942440;ARGS:json.firstName,\
    ctl:ruleRemoveTargetById=942440;ARGS:json.lastName,\
    ctl:ruleRemoveTargetById=942440;ARGS:json.bio,\
    ctl:ruleRemoveTargetById=942440;ARGS:json.name,\
    ctl:ruleRemoveTargetById=942440;ARGS:json.description,\
    ctl:ruleRemoveTargetById=942440;ARGS:json.message,\
    ctl:ruleRemoveTargetById=942440;ARGS:q,\
    ctl:ruleRemoveTargetById=942440;ARGS:firstName,\
    ctl:ruleRemoveTargetById=942440;ARGS:lastName,\
    ctl:ruleRemoveTargetById=932236;ARGS:json.firstName,\
    ctl:ruleRemoveTargetById=932236;ARGS:json.lastName,\
    ctl:ruleRemoveTargetById=932236;ARGS:json.bio,\
    ctl:ruleRemoveTargetById=932236;ARGS:json.name,\
    ctl:ruleRemoveTargetById=932236;ARGS:json.description,\
    ctl:ruleRemoveTargetById=932236;ARGS:json.message,\
    ctl:ruleRemoveTargetById=932236;ARGS:q,\
    ctl:ruleRemoveTargetById=932236;ARGS:firstName,\
    ctl:ruleRemoveTargetById=932236;ARGS:lastName,\
    ctl:ruleRemoveTargetById=942200;ARGS:json.firstName,\
    ctl:ruleRemoveTargetById=942200;ARGS:json.lastName,\
    ctl:ruleRemoveTargetById=942200;ARGS:json.bio,\
    ctl:ruleRemoveTargetById=942200;ARGS:json.name,\
    ctl:ruleRemoveTargetById=942200;ARGS:json.description,\
    ctl:ruleRemoveTargetById=942200;ARGS:json.message,\
    ctl:ruleRemoveTargetById=942200;ARGS:q,\
    ctl:ruleRemoveTargetById=942200;ARGS:firstName,\
    ctl:ruleRemoveTargetById=942200;ARGS:lastName"

# Profile photo upload (since 2026-10-14): POST /api/profile/:id/photo sends
# the image as multipart/form-data, which the API's JSON-only policy (CRS rule
# 920420, ALLOWED_REQUEST_CONTENT_TYPE in docker-compose.yml) refused
# with a 403. Only this one route and method may also send multipart; every
# other route stays JSON only, and every CRS rule still inspects the upload.
# crs-setup.conf has already set the variable in phase 1, before this file.
SecRule REQUEST_URI "@rx ^/api/profile/[0-9]+/photo$" \
    "id:1000040,\
    phase:1,\
    pass,\
    nolog,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "setvar:'tx.allowed_request_content_type=|application/json| |multipart/form-data|'"
